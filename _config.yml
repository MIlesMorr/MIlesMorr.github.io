# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 我的小窝
subtitle: "我是子标题"
# description: ''
# keywords:
author: MilesMorr
language: 
  - zh-CN
 # - zh-TW
 # - en
# timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: http://example.com
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: reimu

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
  

# 顶格写
OhMyLive2d:
  enable: true
  CDN: https://unpkg.com/oh-my-live2d
  option:
    dockedPosition: 'left'
    mobileDisplay: false
    models:
      - path: https://milesmorr.github.io/live2d_models/yang/yang.model3.json
        scale: 0.08
        position: [-80, 50]
        stageStyle:
          width: 280
          height: 350
    menus:
      items: |
        (defaultItems) => {
          // 删除 id 为 'About' 的按钮（注意大小写）
          const filtered = defaultItems.filter(item => item.id !== 'About');
          return [
            ...filtered,
            {
              id: 'SwitchExpression',
              icon: 'emoji-joy',
              title: '切换表情',
              onClick: (oml2d) => {
                const expressions = ['悲', '脸黑', '眼泪', '反绑x'];
                const current = oml2d.models.model._expressionName;
                let nextIndex = (expressions.indexOf(current) + 1) % expressions.length;
                oml2d.models.model.expression(expressions[nextIndex]);
                oml2d.tipsMessage('表情: ' + expressions[nextIndex], 2000);
              }
            }
          ];
        }
        
        
hide_posts:
  enable: true
  filter: hidden          # 用于标记隐藏页面的字段名，默认是 'hidden'[reference:10]
  noindex: true           # 建议开启，告诉搜索引擎不要索引此页面[reference:11]
  # allowlist_generators: [] # 高级选项：白名单，让隐藏页面在特定列表中出现[reference:12]
  # blocklist_generators: ['*'] # 高级选项：黑名单[reference:13]